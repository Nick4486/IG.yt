<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --sub: #888; --accent: #ff3b5c; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    #redirect-screen { display: flex; height: 100vh; align-items: center; justify-content: center; color: var(--sub); font-size: 14px; }
    #dashboard { display: none; max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin-bottom: 16px; font-weight: 600; }
    .add-box { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: var(--card); color: #fff; font-size: 14px; }
    button { padding: 12px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .video-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; display: flex; gap: 14px; align-items: center; }
    .thumb { width: 120px; height: 68px; border-radius: 8px; object-fit: cover; background: #000; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .title { font-size: 15px; font-weight: 600; margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { font-size: 12px; color: var(--sub); display: flex; gap: 12px; flex-wrap: wrap; }
    .badge { background: rgba(255,59,92,0.15); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .copy-btn { background: #2c2c2c; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; }
    .logs-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2c2c2c; font-size: 12px; color: var(--sub); display: none; }
    .log-item { padding: 3px 0; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <!-- 轉址載入畫面（朋友點開時只會閃過這個） -->
  <div id="redirect-screen">正在前往 YouTube...</div>

  <!-- 你的管理面板 -->
  <div id="dashboard">
    <h1>IG 限動影片分享紀錄面板</h1>
    <div class="add-box">
      <input type="text" id="yt-url" placeholder="貼上想分享的 YouTube 影片網址...">
      <button id="add-btn" onclick="createLink()">生成連結</button>
    </div>
    <div id="list">載入資料中...</div>
  </div>

  <script>
    // 把下面這串換成你在 Google Apps Script 部署拿到的 /exec 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZ94DY5KOg6KJrYzZscnyziDxcUdaVPDrQkzJvs3-_HtC_Od-aQQglkw1qn3Y_5pFJ/exec";

    const params = new URLSearchParams(window.location.search);
    const trackId = params.get('id');

    // 判斷：如果網址有 ?id=xxx 就執行紀錄與轉址；沒有就顯示管理面板
    if (trackId) {
      const ua = navigator.userAgent;
      let device = "其他裝置";
      if (/iPhone/i.test(ua)) device = "iPhone";
      else if (/Android/i.test(ua)) device = "Android 手機";
      else if (/iPad/i.test(ua)) device = "iPad";
      else if (/Macintosh|Windows/i.test(ua)) device = "電腦";
      if (/Instagram/i.test(ua)) device += " (IG內建瀏覽器)";

      fetch(`${GAS_URL}?action=click&id=${trackId}&device=${encodeURIComponent(device)}`)
        .then(res => res.json())
        .then(data => {
          if (data.url) window.location.replace(data.url);
        });
    } else {
      document.title = "YT 分享追蹤面板";
      document.getElementById('redirect-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    // 解析 YouTube 影片 ID
    function extractYtId(url) {
      const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.match(reg);
      return match ? match[1] : null;
    }

    // 新增連結（自動透過 noembed 抓取 YT 影片標題）
    async function createLink() {
      const input = document.getElementById('yt-url');
      const btn = document.getElementById('add-btn');
      const url = input.value.trim();
      const ytId = extractYtId(url);
      if (!ytId) return alert('請輸入有效的 YouTube 網址');

      btn.disabled = true;
      btn.innerText = '處理中...';

      let title = 'YouTube 影片';
      try {
        const oembed = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`).then(r => r.json());
        if (oembed.title) title = oembed.title;
      } catch (e) {}

      await fetch(`${GAS_URL}?action=add&ytId=${ytId}&title=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`);
      input.value = '';
      btn.disabled = false;
      btn.innerText = '生成連結';
      loadDashboard();
    }

    // 載入面板資料
    async function loadDashboard() {
      const listEl = document.getElementById('list');
      const res = await fetch(`${GAS_URL}?action=getData`).then(r => r.json());
      if (!res.links.length) {
        listEl.innerHTML = '<p style="color:#666;font-size:14px;">目前還沒有分享紀錄</p>';
        return;
      }

      const baseUrl = window.location.origin + window.location.pathname;
      listEl.innerHTML = res.links.map(item => {
        const shareUrl = `${baseUrl}?id=${item.id}`;
        const itemLogs = res.logs.filter(l => l.id === item.id);
        const logsHtml = itemLogs.length
          ? itemLogs.map(l => `<div class="log-item"><span>${l.timestamp}</span><span>${l.device}</span></div>`).join('')
          : '尚無點擊明細';

        return `
          <div style="background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;">
            <div style="display:flex;gap:14px;align-items:center;">
              <img class="thumb" src="https://img.youtube.com/vi/${item.ytId}/mqdefault.jpg">
              <div class="info">
                <div class="title">${item.title}</div>
                <div class="meta">
                  <span>分享日期：${item.createdAt}</span>
                </div>
              </div>
              <span class="badge" onclick="toggleLogs('${item.id}')" title="點擊展開明細">${item.clicks} 人點擊 ▾</span>
              <button class="copy-btn" onclick="navigator.clipboard.writeText('${shareUrl}');this.innerText='已複製！'">複製連結</button>
            </div>
            <div class="logs-box" id="logs-${item.id}">${logsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function toggleLogs(id) {
      const el = document.getElementById(`logs-${id}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</body>
</html>
