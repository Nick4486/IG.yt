<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --text: #f0f0f0; --sub: #8e8e93; --accent: #ff3b5c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    #redirect-screen { display: flex; height: 100vh; align-items: center; justify-content: center; color: var(--sub); font-size: 14px; }
    #dashboard { display: none; max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0; font-weight: 700; }
    .refresh-btn { background: #2c2c2e; color: var(--text); border: none; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .refresh-btn:active { background: #3a3a3c; }

    .stats-bar { display: flex; gap: 10px; margin-bottom: 16px; }
    .stat-card { flex: 1; background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #262626; }
    .stat-label { font-size: 12px; color: var(--sub); }
    .stat-val { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-val.highlight { color: var(--accent); }

    .add-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #333; background: var(--card); color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    .main-btn { padding: 0 16px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
    .main-btn:disabled { opacity: 0.5; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .toolbar-title { font-size: 13px; color: var(--sub); font-weight: 500; }
    .sort-group { display: flex; background: var(--card); padding: 3px; border-radius: 8px; border: 1px solid #2a2a2a; }
    .sort-btn { background: transparent; color: var(--sub); border: none; padding: 5px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .sort-btn.active { background: #2c2c2e; color: #fff; }

    .video-card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .card-top { display: flex; gap: 12px; align-items: flex-start; }
    
    .thumb-link { position: relative; display: block; flex-shrink: 0; text-decoration: none; }
    .thumb { width: 116px; height: 65px; border-radius: 8px; object-fit: cover; background: #000; display: block; }
    .play-hint { position: absolute; inset: 0; background: rgba(0,0,0,0.35); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; opacity: 0.85; }
    
    .info { flex: 1; min-width: 0; }
    .title-link { color: var(--text); text-decoration: none; }
    .title-link:hover { text-decoration: underline; }
    .title { font-size: 14px; font-weight: 600; line-height: 1.4; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .meta { font-size: 12px; color: var(--sub); }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2a2a; flex-wrap: wrap; gap: 8px; }
    .btn-group { display: flex; gap: 6px; align-items: center; }
    .badge { background: rgba(255,59,92,0.15); color: var(--accent); padding: 6px 10px; border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; user-select: none; }
    .copy-btn { background: #2c2c2e; color: #fff; padding: 7px 12px; font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; border: none; white-space: nowrap; }
    .copy-btn:active { background: #3a3a3c; }
    .dl-btn { background: #252528; color: #d1d1d6; border: 1px solid #3a3a3c; padding: 6px 10px; font-size: 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .dl-btn:active { background: #3a3a3c; }
    .del-btn { background: transparent; color: #8e8e93; border: 1px solid #3a3a3c; padding: 6px 10px; font-size: 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .del-btn:hover { color: #ff453a; border-color: #ff453a; }
    .del-btn:disabled { opacity: 0.4; }

    .logs-box { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #333; font-size: 12px; color: var(--sub); display: none; }
    .log-item { padding: 6px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #252525; }
    .log-item:last-child { border-bottom: none; }
    .log-info { display: flex; justify-content: space-between; flex: 1; gap: 8px; }
    .log-del-btn { background: rgba(255,255,255,0.06); color: #999; border: none; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .log-del-btn:hover { background: rgba(255,69,58,0.2); color: #ff453a; }

    /* 仿 YT 無進度條卡片產生器彈出視窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-box { background: #1c1c1e; border-radius: 16px; max-width: 460px; width: 100%; padding: 18px; border: 1px solid #333; max-height: 92vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .close-btn { background: transparent; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 0 4px; }
    canvas { width: 100%; height: auto; border-radius: 12px; background: #0f0f0f; display: block; margin-bottom: 12px; border: 1px solid #2c2c2e; }
    .field-group { margin-bottom: 10px; }
    .field-label { font-size: 12px; color: var(--sub); margin-bottom: 4px; display: block; }
    .field-input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #fff; font-size: 13px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions button { flex: 1; padding: 11px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #2c2c2e; color: #ddd; }
  </style>
</head>
<body>

  <div id="redirect-screen">正在前往 YouTube...</div>

  <div id="dashboard">
    <div class="header-row">
      <h1>IG 限動影片分享紀錄</h1>
      <button class="refresh-btn" id="refresh-btn" onclick="loadDashboard(true)">↻ 刷新數據</button>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <span class="stat-label">已分享影片</span>
        <span class="stat-val" id="total-videos">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">累計總點擊</span>
        <span class="stat-val highlight" id="total-clicks">0</span>
      </div>
    </div>

    <div class="add-box">
      <input type="text" id="yt-url" placeholder="貼上想分享的 YouTube 影片網址...">
      <button class="main-btn" id="add-btn" onclick="createLink()">生成連結</button>
    </div>

    <div class="toolbar">
      <span class="toolbar-title">分享清單（點縮圖可直接看原片）</span>
      <div class="sort-group">
        <button class="sort-btn active" id="sort-time" onclick="changeSort('time')">最新分享</button>
        <button class="sort-btn" id="sort-clicks" onclick="changeSort('clicks')">最多人點</button>
      </div>
    </div>

    <div id="list">載入資料中...</div>
  </div>

  <!-- 製作限動卡片視窗 -->
  <div class="modal-overlay" id="card-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">製作無進度條 YT 限動圖</span>
        <button class="close-btn" onclick="closeCardModal()">✕</button>
      </div>
      <canvas id="yt-canvas" width="1280" height="920"></canvas>
      <div class="field-group">
        <label class="field-label">影片標題</label>
        <input type="text" class="field-input" id="card-title" oninput="drawYtCard()">
      </div>
      <div class="field-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <label class="field-label" style="margin:0;">標題字體大小（左右滑動微調）</label>
          <span id="font-size-val" style="font-size:12px; color:var(--accent); font-weight:600;">46px</span>
        </div>
        <input type="range" id="card-title-size" min="32" max="64" value="46" style="width:100%; accent-color:var(--accent); padding:0; cursor:pointer;" oninput="document.getElementById('font-size-val').innerText=this.value+'px'; drawYtCard()">
      </div>
      <div style="display:flex; gap:8px;">
        <div class="field-group" style="flex:1;">
          <label class="field-label">頻道名稱</label>
          <input type="text" class="field-input" id="card-author" placeholder="例如：神仙補習班" oninput="drawYtCard()">
        </div>
        <div class="field-group" style="flex:1;">
          <label class="field-label">觀看數與時間（選填）</label>
          <input type="text" class="field-input" id="card-views" placeholder="例如：4.6萬  3 年前" oninput="drawYtCard()">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="document.getElementById('avatar-upload').click()">更換頻道頭像</button>
        <input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
        <button class="btn-primary" onclick="downloadCanvasCard()">下載限動圖片</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZ94DY5KOg6KJrYzZscnyziDxcUdaVPDrQkzJvs3-_HtC_Od-aQQglkw1qn3Y_5pFJ/exec";

    let cachedData = { links: [], logs: [] };
    let currentSort = 'time';
    let openLogsSet = new Set();

    let currentCardYtId = '';
    let loadedThumbImg = null;
    let loadedAvatarImg = null;

    const params = new URLSearchParams(window.location.search);
    const trackId = params.get('id');

    if (trackId) {
      const ua = navigator.userAgent;
      let device = "其他裝置";
      if (/iPhone/i.test(ua)) device = "iPhone";
      else if (/Android/i.test(ua)) device = "Android 手機";
      else if (/iPad/i.test(ua)) device = "iPad";
      else if (/Macintosh|Windows/i.test(ua)) device = "電腦";
      if (/Instagram/i.test(ua)) device += " (IG內建)";

      fetch(`${GAS_URL}?action=click&id=${trackId}&device=${encodeURIComponent(device)}`)
        .then(res => res.json())
        .then(data => {
          if (data.url) window.location.replace(data.url);
        });
    } else {
      document.title = "YT 分享追蹤面板";
      document.getElementById('redirect-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    function formatTime(str, showSeconds = false) {
      if (!str) return '';
      const d = new Date(str);
      if (isNaN(d.getTime())) return str;
      const pad = n => String(n).padStart(2, '0');
      const base = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      return showSeconds ? `${base}:${pad(d.getSeconds())}` : base;
    }

    function extractYtId(url) {
      const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.match(reg);
      return match ? match[1] : null;
    }

    async function createLink() {
      const input = document.getElementById('yt-url');
      const btn = document.getElementById('add-btn');
      const url = input.value.trim();
      const ytId = extractYtId(url);
      if (!ytId) return alert('請輸入有效的 YouTube 網址');

      btn.disabled = true;
      btn.innerText = '處理中...';

      let title = 'YouTube 影片';
      try {
        const oembed = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`).then(r => r.json());
        if (oembed.title) title = oembed.title;
      } catch (e) {}

      const baseUrl = window.location.origin + window.location.pathname;
      await fetch(`${GAS_URL}?action=add&ytId=${ytId}&title=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}&base=${encodeURIComponent(baseUrl)}`);
      input.value = '';
      btn.disabled = false;
      btn.innerText = '生成連結';
      loadDashboard();
    }

    async function deleteLink(id, btn) {
      if (!confirm('確定要刪除這整筆影片分享紀錄嗎？')) return;
      btn.disabled = true;
      btn.innerText = '刪除中...';
      openLogsSet.delete(id);
      await fetch(`${GAS_URL}?action=delete&id=${id}`);
      loadDashboard();
    }

    async function deleteSingleLog(id, row, btn) {
      btn.disabled = true;
      btn.innerText = '…';
      openLogsSet.add(id);
      await fetch(`${GAS_URL}?action=deleteLog&id=${id}&row=${row}`);
      loadDashboard();
    }

    function loadImgCrossOrigin(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          if (img.width <= 120 && url.includes('maxresdefault')) reject();
          else resolve(img);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function formatViewsCount(num) {
      if (!num) return '';
      if (num >= 10000) return (num / 10000).toFixed(1).replace(/\.0$/, '') + '萬';
      return String(num);
    }

    async function openCardGenerator(ytId, defaultTitle) {
      currentCardYtId = ytId;
      loadedThumbImg = null;
      loadedAvatarImg = null;

      document.getElementById('card-title').value = defaultTitle || 'YouTube 影片';
      document.getElementById('card-author').value = '讀取頻道中...';
      document.getElementById('card-views').value = '';
      document.getElementById('card-modal').style.display = 'flex';

      const qualities = ['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault'];
      for (const q of qualities) {
        try {
          loadedThumbImg = await loadImgCrossOrigin(`https://img.youtube.com/vi/${ytId}/${q}.jpg`);
          break;
        } catch (e) {}
      }
      drawYtCard();

      try {
        const oembed = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`).then(r => r.json());
        if (oembed.author_name) {
          document.getElementById('card-author').value = oembed.author_name;
          drawYtCard();
        }
      } catch (e) {
        document.getElementById('card-author').value = '';
      }

      try {
        const piped = await fetch(`https://pipedapi.kavin.rocks/streams/${ytId}`).then(r => r.json());
        if (piped.views) {
          const vStr = formatViewsCount(piped.views);
          document.getElementById('card-views').value = vStr;
        }
        if (piped.uploaderAvatar) {
          loadedAvatarImg = await loadImgCrossOrigin(`https://images.weserv.nl/?url=${encodeURIComponent(piped.uploaderAvatar)}`);
        }
        drawYtCard();
      } catch (e) {}
    }

    function closeCardModal() {
      document.getElementById('card-modal').style.display = 'none';
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        const img = new Image();
        img.onload = () => {
          loadedAvatarImg = img;
          drawYtCard();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawYtCard() {
      const canvas = document.getElementById('yt-canvas');
      const ctx = canvas.getContext('2d');
      const title = document.getElementById('card-title').value;
      const author = document.getElementById('card-author').value;
      const views = document.getElementById('card-views').value;
      const titleSize = Number(document.getElementById('card-title-size').value) || 46;
      const lineHeight = Math.round(titleSize * 1.32);

      const pad = 32;
      const thumbW = 1216;
      const thumbH = 684;

      // 1. 根據你目前調整的字體大小計算自動換行（最多 2 行）
      ctx.font = `bold ${titleSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif`;
      const maxTextW = 960;
      let lines = [];
      let cur = '';
      for (const ch of title) {
        if (ctx.measureText(cur + ch).width > maxTextW) {
          lines.push(cur);
          cur = ch;
          if (lines.length === 2) break;
        } else {
          cur += ch;
        }
      }
      if (lines.length < 2 && cur) lines.push(cur);
      else if (lines.length === 2 && cur) lines[1] = lines[1].slice(0, -1) + '…';

      canvas.height = pad + thumbH + 32 + (lines.length * lineHeight) + 64;

      // 2. 填滿深色背景 (#0f0f0f)
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 3. 繪製圓角封面圖
      ctx.save();
      roundRectPath(ctx, pad, pad, thumbW, thumbH, 28);
      ctx.clip();
      if (loadedThumbImg) {
        const scale = Math.max(thumbW / loadedThumbImg.width, thumbH / loadedThumbImg.height);
        const sw = loadedThumbImg.width * scale;
        const sh = loadedThumbImg.height * scale;
        const sx = pad + (thumbW - sw) / 2;
        const sy = pad + (thumbH - sh) / 2;
        ctx.drawImage(loadedThumbImg, sx, sy, sw, sh);
      } else {
        ctx.fillStyle = '#222';
        ctx.fillRect(pad, pad, thumbW, thumbH);
      }
      ctx.restore();

      // 4. 繪製左下角圓形頻道頭像
      const avX = pad + 44;
      const avY = pad + thumbH + 74;
      const avR = 44;
      ctx.save();
      ctx.beginPath();
      ctx.arc(avX, avY, avR, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      if (loadedAvatarImg) {
        ctx.drawImage(loadedAvatarImg, avX - avR, avY - avR, avR * 2, avR * 2);
      } else {
        const grad = ctx.createLinearGradient(avX - avR, avY - avR, avX + avR, avY + avR);
        grad.addColorStop(0, '#ff3b5c');
        grad.addColorStop(1, '#ff9500');
        ctx.fillStyle = grad;
        ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 38px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText((author || 'Y').trim().charAt(0), avX, avY + 2);
      }
      ctx.restore();

      // 5. 繪製白色影片標題（套用滑桿字體大小）
      ctx.fillStyle = '#f1f1f1';
      ctx.font = `bold ${titleSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const textX = pad + 114;
      let textY = pad + thumbH + 30;
      lines.forEach(line => {
        ctx.fillText(line, textX, textY);
        textY += lineHeight;
      });

      // 6. 繪製灰色頻道名稱與觀看數（字體大小也會稍微跟著標題比例微調）
      const subSize = Math.max(28, Math.round(titleSize * 0.68));
      ctx.fillStyle = '#aaaaaa';
      ctx.font = `${subSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif`;
      let subText = author || '';
      if (views) subText += (subText ? '   ▷ ' : '▷ ') + views;
      ctx.fillText(subText, textX, textY + 6);

      // 7. 繪製右側三個垂直小白點圖示
      const dotX = canvas.width - pad - 14;
      const dotStartY = pad + thumbH + 46;
      ctx.fillStyle = '#f1f1f1';
      [0, 16, 32].forEach(offset => {
        ctx.beginPath();
        ctx.arc(dotX, dotStartY + offset, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function downloadCanvasCard() {
      const canvas = document.getElementById('yt-canvas');
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `YT限動卡_${currentCardYtId}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text);
      const old = btn.innerText;
      btn.innerText = '已複製！';
      setTimeout(() => { btn.innerText = old; }, 1500);
    }

    function changeSort(type) {
      currentSort = type;
      document.getElementById('sort-time').classList.toggle('active', type === 'time');
      document.getElementById('sort-clicks').classList.toggle('active', type === 'clicks');
      renderList();
    }

    async function loadDashboard(isManualRefresh = false) {
      const refBtn = document.getElementById('refresh-btn');
      if (isManualRefresh) refBtn.innerText = '讀取中...';

      const res = await fetch(`${GAS_URL}?action=getData`).then(r => r.json());
      cachedData = res;

      if (isManualRefresh) refBtn.innerText = '↻ 刷新數據';
      renderList();
    }

    function renderList() {
      const listEl = document.getElementById('list');
      const links = [...cachedData.links];
      const logs = cachedData.logs || [];

      document.getElementById('total-videos').innerText = links.length;
      const sumClicks = links.reduce((acc, cur) => acc + (Number(cur.clicks) || 0), 0);
      document.getElementById('total-clicks').innerText = sumClicks;

      if (!links.length) {
        listEl.innerHTML = '<p style="color:#666;font-size:14px;text-align:center;padding:20px 0;">目前還沒有分享紀錄</p>';
        return;
      }

      if (currentSort === 'clicks') {
        links.sort((a, b) => (Number(b.clicks) || 0) - (Number(a.clicks) || 0));
      }

      const baseUrl = window.location.origin + window.location.pathname;
      listEl.innerHTML = links.map(item => {
        const finalShareUrl = item.shortUrl || `${baseUrl}?id=${item.id}`;
        const origYtUrl = item.url || `https://www.youtube.com/watch?v=${item.ytId}`;
        const itemLogs = logs.filter(l => l.id === item.id);
        const isOpen = openLogsSet.has(item.id);
        const safeTitle = (item.title || 'YouTube 影片').replace(/'/g, "\\'").replace(/"/g, '&quot;');

        const logsHtml = itemLogs.length
          ? itemLogs.map(l => `
              <div class="log-item">
                <div class="log-info">
                  <span>${formatTime(l.timestamp, true)}</span>
                  <span>${l.device}</span>
                </div>
                <button class="log-del-btn" title="刪除此筆點擊並 -1" onclick="deleteSingleLog('${item.id}', ${l.row}, this)">✕</button>
              </div>
            `).join('')
          : '<div style="padding:4px 0;">尚無點擊明細</div>';

        return `
          <div class="video-card">
            <div class="card-top">
              <a class="thumb-link" href="${origYtUrl}" target="_blank" rel="noopener" title="直接觀看原片（不計入點擊）">
                <img class="thumb" src="https://img.youtube.com/vi/${item.ytId}/mqdefault.jpg">
                <div class="play-hint">▶</div>
              </a>
              <div class="info">
                <a class="title-link" href="${origYtUrl}" target="_blank" rel="noopener">
                  <div class="title">${item.title || 'YouTube 影片'}</div>
                </a>
                <div class="meta">分享於 ${formatTime(item.createdAt)}</div>
              </div>
            </div>
            <div class="card-actions">
              <span class="badge" onclick="toggleLogs('${item.id}')">${item.clicks} 人點擊 ▾</span>
              <div class="btn-group">
                <button class="del-btn" onclick="deleteLink('${item.id}', this)">刪除</button>
                <button class="dl-btn" onclick="openCardGenerator('${item.ytId}', '${safeTitle}')">製作限動圖</button>
                <button class="copy-btn" onclick="copyText('${finalShareUrl}', this)">複製短網址</button>
              </div>
            </div>
            <div class="logs-box" id="logs-${item.id}" style="display:${isOpen ? 'block' : 'none'};">${logsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function toggleLogs(id) {
      const el = document.getElementById(`logs-${id}`);
      if (el.style.display === 'block') {
        el.style.display = 'none';
        openLogsSet.delete(id);
      } else {
        el.style.display = 'block';
        openLogsSet.add(id);
      }
    }
  </script>
</body>
</html>
